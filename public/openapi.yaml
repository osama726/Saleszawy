openapi: 3.0.3

info:
  title: Saleszawy CMS API
  description: API عامة لجلب صفحات CMS المنشورة ومحتوياتها.
  version: 1.0.0

servers:
  - url: http://localhost:8000/api
    description: بيئة التطوير المحلية

tags:
  - name: Pages
    description: صفحات الموقع المنشورة
  - name: Layout
    description: بيانات الهيدر والفوتر المشتركة للموقع
  - name: Plans
    description: باقات الاشتراك المنشورة

paths:
  /v1/pages/{slug}:
    get:
      tags:
        - Pages
      summary: جلب صفحة منشورة بالـ slug
      description: يعيد الصفحة المنشورة مع البلوكات المرئية فقط مرتبة حسب sort_order.
      operationId: getPublishedPage
      parameters:
        - name: slug
          in: path
          required: true
          description: المعرّف النصي الفريد للصفحة
          schema:
            type: string
            example: home
      responses:
        "200":
          description: تم جلب الصفحة بنجاح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponse"
              example:
                success: true
                message: ""
                data:
                  id: 1
                  slug: home
                  title: سيلزواي
                  seo:
                    title: سيلزواي - نظام إدارة علاقات العملاء
                    description: الوصف الخاص بمحركات البحث
                  published_at: "2026-11-22T12:00:00+00:00"
                  updated_at: "2026-11-22T12:30:00+00:00"
                  blocks:
                    - id: 1
                      type: hero
                      data:
                        headline: أكبر منصة مبيعات في الشرق الأوسط
                meta: {}
        "404":
          description: الصفحة غير موجودة أو غير منشورة
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: العنصر المطلوب غير موجود
                code: NOT_FOUND
        "429":
          description: تجاوز حد الطلبات المسموح
          headers:
            Retry-After:
              description: عدد الثواني حتى يمكن إعادة المحاولة
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: عدد الطلبات كبير، حاول مرة أخرى بعد قليل
                code: TOO_MANY_REQUESTS
        "500":
          description: خطأ داخلي في الخادم
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: حدث خطأ غير متوقع
                code: SERVER_ERROR

  /v1/pages/{slug}/blocks/{key}:
    get:
      tags:
        - Pages
      summary: جلب بلوك واحد من صفحة منشورة
      description: يعيد بلوكاً مرئياً واحداً حسب المعرّف key داخل الصفحة المنشورة.
      operationId: getPublishedPageBlock
      parameters:
        - name: slug
          in: path
          required: true
          description: المعرّف النصي للصفحة
          schema:
            type: string
            example: home
        - name: key
          in: path
          required: true
          description: المعرّف الفريد للبلوك داخل الصفحة، مثل faq أو cta-2
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]+$"
            example: faq
      responses:
        "200":
          description: تم جلب البلوك بنجاح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageBlockResponse"
              example:
                success: true
                message: ""
                data:
                  id: 1
                  key: faq
                  type: faq
                  data:
                    title: FAQ
                meta: {}
        "404":
          description: الصفحة أو البلوك غير موجود أو البلوك مخفي
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: العنصر المطلوب غير موجود
                code: NOT_FOUND
        "429":
          description: تجاوز حد الطلبات المسموح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: خطأ داخلي في الخادم
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/layout:
    get:
      tags: [Layout]
      summary: جلب الهيدر والفوتر معاً
      operationId: getLayout
      responses:
        "200":
          description: تم جلب بيانات التخطيط بنجاح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayoutResponse"
        "429":
          description: تجاوز حد الطلبات المسموح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/layout/header:
    get:
      tags: [Layout]
      summary: جلب الهيدر فقط
      operationId: getHeader
      responses:
        "200":
          description: تم جلب بيانات الهيدر بنجاح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeaderResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/layout/footer:
    get:
      tags: [Layout]
      summary: جلب الفوتر فقط
      operationId: getFooter
      responses:
        "200":
          description: تم جلب بيانات الفوتر بنجاح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FooterResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/plans:
    get:
      tags: [Plans]
      summary: جلب باقات الاشتراك المنشورة
      operationId: listPublishedPlans
      responses:
        "200":
          description: تم جلب الباقات مرتبة حسب sort_order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlansResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  schemas:
    PageResponse:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          enum:
            - true
          example: true
        message:
          type: string
          example: ""
        data:
          $ref: "#/components/schemas/Page"
        meta:
          type: object
          additionalProperties: true
          example: {}

    Page:
      type: object
      required:
        - id
        - slug
        - title
        - seo
        - published_at
        - updated_at
        - blocks
      properties:
        id:
          type: integer
          format: int64
          example: 1
        slug:
          type: string
          example: home
        title:
          type: string
          example: سيلزواي
        seo:
          $ref: "#/components/schemas/Seo"
        published_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-11-22T12:00:00+00:00"
        updated_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-11-22T12:30:00+00:00"
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/PageBlock"

    Seo:
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
          nullable: true
          example: سيلزواي - نظام إدارة علاقات العملاء
        description:
          type: string
          nullable: true
          example: الوصف الخاص بمحركات البحث

    PageBlock:
      type: object
      required:
        - id
        - key
        - type
        - data
      properties:
        id:
          type: integer
          format: int64
          example: 1
        key:
          type: string
          description: معرّف البلوك الفريد داخل الصفحة
          pattern: "^[A-Za-z0-9_-]+$"
          example: faq
        type:
          $ref: "#/components/schemas/BlockType"
        data:
          type: object
          additionalProperties: true
          description: بيانات البلوك تختلف حسب نوع البلوك
          example:
            headline: أكبر منصة مبيعات في الشرق الأوسط

    BlockType:
      type: string
      description: أنواع البلوكات المتاحة في صفحات CMS
      enum:
        - hero
        - partners
        - problem_solution
        - showcase
        - features_explorer
        - pbx
        - steps
        - stats
        - comparison
        - pricing
        - integrations
        - faq
        - blog
        - about
        - contact
        - cta

    ErrorResponse:
      type: object
      required:
        - success
        - message
        - code
      properties:
        success:
          type: boolean
          enum:
            - false
          example: false
        message:
          type: string
          example: العنصر المطلوب غير موجود
        code:
          type: string
          enum:
            - NOT_FOUND
            - TOO_MANY_REQUESTS
            - VALIDATION_ERROR
            - UNAUTHENTICATED
            - FORBIDDEN
            - HTTP_ERROR
            - SERVER_ERROR
          example: NOT_FOUND
        errors:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string

    PageBlockResponse:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          enum:
            - true
          example: true
        message:
          type: string
          example: ""
        data:
          $ref: "#/components/schemas/PageBlock"
        meta:
          type: object
          additionalProperties: true
          example: {}

    LayoutResponse:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          enum:
            - true
          example: true
        message:
          type: string
          example: ""
        data:
          $ref: "#/components/schemas/Layout"
        meta:
          type: object
          additionalProperties: true
          example: {}

    Layout:
      type: object
      required:
        - header
        - footer
      properties:
        header:
          $ref: "#/components/schemas/Header"
        footer:
          $ref: "#/components/schemas/Footer"

    Header:
      type: object
      properties:
        brand:
          $ref: "#/components/schemas/Brand"
        links:
          type: array
          items:
            $ref: "#/components/schemas/MenuItem"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/MenuItem"

    HeaderResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        data:
          $ref: "#/components/schemas/Header"
        meta:
          type: object
          additionalProperties: true

    Footer:
      type: object
      properties:
        brand:
          $ref: "#/components/schemas/Brand"
        description:
          type: string
        columns:
          type: array
          items:
            $ref: "#/components/schemas/FooterColumn"
        socials:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
        copyright:
          type: string
        back_to_top_label:
          type: string
        floating_cta:
          nullable: true
          type: object
          properties:
            label:
              type: string
            url:
              type: string

    FooterResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        data:
          $ref: "#/components/schemas/Footer"
        meta:
          type: object
          additionalProperties: true

    Brand:
      type: object
      properties:
        name:
          type: string
        text:
          type: string
        badge:
          nullable: true
          type: string
        logo:
          nullable: true
          type: string
        url:
          type: string

    MenuItem:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
        url:
          type: string
        kind:
          type: string
          enum: [link, button]
        variant:
          nullable: true
          type: string
          enum: [ghost, primary, outline]
        new_tab:
          type: boolean
        children:
          type: array
          items:
            $ref: "#/components/schemas/MenuItem"

    FooterColumn:
      type: object
      properties:
        key:
          type: string
        title:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/MenuItem"

    Plan:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          nullable: true
          type: string
        price:
          type: object
          properties:
            monthly:
              nullable: true
              oneOf:
                - type: integer
                - type: number
            yearly:
              nullable: true
              oneOf:
                - type: integer
                - type: number
            currency:
              type: string
        trial_days:
          type: integer
        limits:
          type: object
          properties:
            sales_users:
              type: integer
            leads:
              type: integer
        features:
          type: array
          items:
            type: string
        is_featured:
          type: boolean
        badge:
          nullable: true
          type: string
        cta:
          type: object
          properties:
            label:
              nullable: true
              type: string
            url:
              nullable: true
              type: string

    PlansResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Plan"
        meta:
          type: object
          additionalProperties: true
  responses:
    TooManyRequests:
      description: تجاوز حد الطلبات المسموح
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: خطأ داخلي في الخادم
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
